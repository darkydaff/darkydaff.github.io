<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>darkydaff Photography</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="landing">
    <h1>darkydaff</h1>
    <button id="viewGalleryBtn" aria-label="View Gallery">View Gallery</button>
  </section>

  <section id="gallery" aria-label="Photo Gallery"></section>

  <div id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" tabindex="-1">
    <button id="closeBtn" aria-label="Close Full View">✕</button>
    <button id="prevBtn" aria-label="Previous Photo">‹</button>
    <button id="nextBtn" aria-label="Next Photo">›</button>
    <button id="zoomInBtn" aria-label="Zoom In">＋</button>
    <button id="zoomOutBtn" aria-label="Zoom Out">−</button>
    <img id="lightboxImage" src="" alt="Full Photo" draggable="false" />
  </div>

  <footer>
    <a href="https://instagram.com/darkydaff.jpg" target="_blank" rel="noopener" aria-label="Instagram">
      <svg>...instagram icon svg...</svg>
    </a>
    <a href="https://t.me/darkydaff" target="_blank" rel="noopener" aria-label="Telegram">
      <svg>...telegram icon svg...</svg>
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
